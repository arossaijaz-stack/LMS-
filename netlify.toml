# Netlify configuration for the backend.
# Deploy this from the "backend" directory as its own Netlify site,
# separate from the frontend site.
#
# This project has TWO Netlify sites in the recommended setup:
#   1. This one (backend) - API only, as a serverless function
#   2. frontend/ - the Next.js app, using Netlify's Next.js runtime
# They deploy independently, each with its own netlify.toml and its
# own environment variables configured in the Netlify dashboard.

[build]
  command = "npm install && npx prisma generate && npm run build"
  functions = "netlify/functions"
  publish = "dist"

[build.environment]
  # NODE_ENV=production is intentionally set as a runtime env var (see
  # PaymentProviderService, which checks it to fail closed on
  # unverified webhooks in production). Its side effect: npm's default
  # behavior is to SKIP devDependencies entirely when NODE_ENV=production
  # during npm install -- which broke the build, since @nestjs/cli
  # (needed for "nest build") and TypeScript itself both live in
  # devDependencies. This flag forces devDependencies to install
  # regardless, fixing the build without having to stop setting
  # NODE_ENV=production for the actual deployed function.
  NPM_FLAGS = "--include=dev"

[functions]
  node_bundler = "esbuild"
  # NestJS core internally references @nestjs/microservices and
  # @nestjs/websockets via dynamic require() calls, used only if you
  # actually enable microservices/websocket gateways - which this app
  # doesn't. Those packages are intentionally NOT installed (no need
  # for them), but esbuild tries to statically resolve every require()
  # at bundle time regardless, including NestJS's internal optional
  # ones, and fails since the packages aren't present. Marking them
  # external tells esbuild to leave those require() calls alone rather
  # than bundling them - NestJS's own code already handles the case
  # where they're absent at runtime (this is a well-documented
  # NestJS + esbuild + serverless deployment gotcha, not specific to
  # this project).
  external_node_modules = ["@nestjs/microservices", "@nestjs/websockets"]
  # Prisma's query engine binary must ship WITH the function bundle,
  # or the function fails at runtime with a "query engine not found"
  # error (the same class of issue this project's own sandbox hit
  # repeatedly during development - see PHASE3-README.md).
  included_files = ["node_modules/.prisma/**", "node_modules/@prisma/client/**"]

# Routes every /api/* request to the single bundled function.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api"
  status = 200
